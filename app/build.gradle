plugins {
    id "com.android.application"
}

def keystorePropertiesFile = project.file("key/keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    compileSdk = 37
    buildToolsVersion = "37.0.0"
    namespace = "com.brickredstudio.twilightline"

    defaultConfig {
        applicationId = "com.brickredstudio.twilightline"
        minSdk  = 23
        targetSdk = 37
        versionCode = 1
        versionName = "0.1.1"

        manifestPlaceholders = [
            appName: "Twilight Line"
        ]
    }

    signingConfigs {
        release {
            enableV1Signing = true
            enableV2Signing = true
            storeFile = project.file("key/android.keystore")
            storePassword = keystoreProperties["storePassword"]
            keyAlias = keystoreProperties["keyAlias"]
            keyPassword = keystoreProperties["keyPassword"]
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        disable += [
            "GoogleAppIndexingWarning",
            "IconMissingDensityFolder",
            "ObsoleteLintCustomCheck",
            "SetTextI18n"
        ]
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.fragment:fragment:1.9.1"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.1.21"))
    implementation(files("libs/tun2socks.aar"))
}
